<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>RiderKit moderation</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px;color:#1b1b1f}input,select,button{font:inherit;padding:8px 10px;margin:2px}button{cursor:pointer}.r{border:1px solid #ccc;border-radius:10px;padding:10px;margin:10px 0}.r img{max-width:160px;max-height:160px;margin:4px;border-radius:8px}.m{color:#555;font-size:13px}.bad{color:#b91c1c}pre{white-space:pre-wrap;word-break:break-word;margin:4px 0}</style></head><body>
<h1>Moderation queue</h1>
<p class="m">Enter the ADMIN_TOKEN. It is kept only in this tab (sessionStorage) and sent in the x-admin-token header.</p>
<input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"> <select id="st"><option>open</option><option>actioned</option><option>dismissed</option><option>all</option></select> <button id="go">Load</button> <button id="stats">Stats</button>
<p>Rider: <input id="who" placeholder="handle"> <button id="sus">Suspend</button> <button id="uns">Unsuspend</button> <button id="info">Info</button></p>
<div id="msg" class="m"></div><div id="out"></div>
<script>
const $=id=>document.getElementById(id);$('tok').value=sessionStorage.getItem('rk-adm')||'';
const call=async(m,p,b)=>{sessionStorage.setItem('rk-adm',$('tok').value);const r=await fetch('/api/community/admin'+p,{method:m,headers:{'x-admin-token':$('tok').value,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const T=(t,x)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;return e};
async function img(box,id){try{const r=await fetch('/api/community/admin/img/'+id,{headers:{'x-admin-token':$('tok').value}});if(!r.ok)return;const i=T('img');i.src=URL.createObjectURL(await r.blob());box.append(i)}catch{}}
async function load(){$('msg').textContent='';$('out').textContent='';try{const j=await call('GET','/reports?state='+$('st').value);if(!j.reports.length)$('msg').textContent='Nothing here.';for(const r of j.reports){const d=T('div');d.className='r';d.append(T('b',r.kind+' · '+r.reason+' · owner @'+r.owner+' · reported by @'+r.reporter),T('div',new Date(r.at).toLocaleString()+' · '+r.state+(r.contentState?' · content '+r.contentState:'')+(r.gone?' · (content gone)':'')));if(r.note)d.append(T('div','Note: '+r.note));d.append(T('pre',r.content?JSON.stringify(r.content,null,1):''));(r.images||[]).forEach(i=>img(d,i));
for(const [a,l] of [['hide','Hide'],['restore','Restore'],['remove','Remove content'],['dismiss','Dismiss'],['suspend','Suspend owner']]){const b=T('button',l);b.onclick=async()=>{try{await call('POST','/action',a==='suspend'?{action:'suspend',id:r.ownerId,reason:r.reason}:{action:a,kind:r.kind,id:r.target});load()}catch(e){$('msg').textContent=e.message}};d.append(b)}$('out').append(d)}}catch(e){$('msg').textContent=e.message;$('msg').className='bad'}}
$('go').onclick=load;$('stats').onclick=async()=>{try{$('msg').textContent=JSON.stringify(await call('GET','/stats'))}catch(e){$('msg').textContent=e.message}};
const rider=a=>async()=>{try{$('msg').textContent=JSON.stringify(await call('POST','/action',{action:a,id:$('who').value,reason:'admin'}))}catch(e){$('msg').textContent=e.message}};$('sus').onclick=rider('suspend');$('uns').onclick=rider('unsuspend');
$('info').onclick=async()=>{try{$('msg').textContent=JSON.stringify(await call('GET','/user?handle='+encodeURIComponent($('who').value)))}catch(e){$('msg').textContent=e.message}};
</script></body></html>
