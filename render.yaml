services:
  - type: web
    name: riderkit
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund   # installs the optional pg driver (only used when DATABASE_URL is set)
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_TOKEN
        sync: false
      - key: RESEND_API_KEY   # accounts: emailed codes (leave unset = accounts disabled in production)
        sync: false
      - key: EMAIL_FROM       # e.g. RiderKit <no-reply@yourdomain.com>, must be on a domain verified in Resend
        sync: false
      - key: DATABASE_URL     # accounts storage: Neon/Supabase Postgres URL. Unset = JSON file (LOST on every Render free restart/redeploy)
        sync: false
      - key: VAPID_PUBLIC_KEY   # optional: Web Push reminders. Unset = a key pair is generated and stored in the KV store (JSON file lost on restart unless DATABASE_URL is set; clients re-subscribe automatically)
        sync: false
      - key: VAPID_PRIVATE_KEY  # keep secret (base64url P-256 private scalar). Generate: node -e "const c=require('crypto');const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});const p=k.publicKey.export({format:'jwk'}),s=k.privateKey.export({format:'jwk'});console.log(Buffer.concat([Buffer.from([4]),Buffer.from(p.x,'base64url'),Buffer.from(p.y,'base64url')]).toString('base64url'),s.d)"
        sync: false
      - key: VAPID_SUBJECT      # optional contact URL/mailto for push services (default https://riderkit.onrender.com)
        sync: false
