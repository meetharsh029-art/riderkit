services:
  - type: web
    name: riderkit
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund   # installs the optional pg driver (only used when DATABASE_URL is set)
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_TOKEN
        sync: false
      - key: RESEND_API_KEY   # accounts: emailed codes (leave unset = accounts disabled in production)
        sync: false
      - key: EMAIL_FROM       # e.g. Malhiva <no-reply@yourdomain.com>, must be on a domain verified in Resend
        sync: false
      - key: DATABASE_URL     # accounts storage: Neon/Supabase Postgres URL. Unset = JSON file (LOST on every Render free restart/redeploy)
        sync: false
      - key: VAPID_PUBLIC_KEY   # optional: Web Push reminders. Unset = a key pair is generated and stored in the KV store (JSON file lost on restart unless DATABASE_URL is set; clients re-subscribe automatically)
        sync: false
      - key: VAPID_PRIVATE_KEY  # keep secret (base64url P-256 private scalar). Generate: node -e "const c=require('crypto');const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});const p=k.publicKey.export({format:'jwk'}),s=k.privateKey.export({format:'jwk'});console.log(Buffer.concat([Buffer.from([4]),Buffer.from(p.x,'base64url'),Buffer.from(p.y,'base64url')]).toString('base64url'),s.d)"
        sync: false
      - key: VAPID_SUBJECT      # optional contact URL/mailto for push services (default https://riderkit.onrender.com)
        sync: false
      - key: COMMUNITY            # set to 1 to switch the community on (needs DATABASE_URL; refuses to start on the JSON file in production)
        sync: false
      - key: COMMUNITY_NEW_ACCOUNT_HOURS   # optional, default 24: accounts younger than this get half rate limits and cannot post pictures publicly (0 = off)
        sync: false
      - key: IMAGE_S3_ENDPOINT    # photos: S3-compatible store, e.g. https://s3.us-west-004.backblazeb2.com (Backblaze B2, no card needed)
        sync: false
      - key: IMAGE_S3_REGION      # e.g. us-west-004
        sync: false
      - key: IMAGE_S3_BUCKET      # private bucket name
        sync: false
      - key: IMAGE_S3_KEY_ID      # application key ID (bucket-scoped key)
        sync: false
      - key: IMAGE_S3_SECRET      # application key secret
        sync: false
